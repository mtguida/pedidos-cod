<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedidos COD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
:root {
  --paper: #F6F3EC; --paper-card: #FFFFFF; --ink: #2B2823; --ink-soft: #8A8378; --hairline: #E4DFD3;
  --accent-agend: #2F6F4E; --accent-agend-bg: #E3EFE7; --accent-pre: #3D5A80; --accent-pre-bg: #E5EBF2;
  --accent-reconf: #B6712B; --accent-reconf-bg: #F4E9DA; --stamp: #C1432D; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #1C1A17; --paper-card: #26231F; --ink: #EFEAE2; --ink-soft: #9C9488; --hairline: #3A352E;
    --accent-agend-bg: #233830; --accent-pre-bg: #232E3D; --accent-reconf-bg: #3A2E1E; }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; padding: 1rem;
  background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.025) 1px, transparent 0); background-size: 22px 22px; }
@media (prefers-color-scheme: dark) { body { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0); } }
@media (min-width: 640px) { body { padding: 2rem; } }
.layout { display: grid; grid-template-columns: 1fr 230px; gap: 18px; max-width: 880px; margin: 0 auto; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .painel-dir { order: 2; } }
.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 6px; }
.header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.header .sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1.5px solid var(--hairline); overflow-x: auto; }
.tab { font-family: 'Space Grotesk', sans-serif; flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 10px 8px; border: none; background: transparent; cursor: pointer; color: var(--ink-soft); white-space: nowrap; position: relative; top: 1.5px; border-bottom: 2.5px solid transparent; transition: color 0.15s, border-color 0.15s; }
.tab.ativa { color: var(--ink); border-bottom-color: var(--stamp); }
.tab:active { opacity: 0.7; }
.dia-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; }
.editando-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--accent-reconf-bg); color: var(--accent-reconf); font-weight: 600; font-family: 'Inter', sans-serif; }
.bloco { background: var(--paper-card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 1.1rem 1.25rem; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(43,40,35,0.04); position: relative; overflow: hidden; }
.bloco::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.t1::before { background: var(--accent-agend); } .t2::before { background: var(--accent-pre); } .t3::before { background: var(--accent-reconf); }
.bloco-titulo { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
.bloco-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; margin-bottom: 12px; }
.marcacoes { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; min-height: 32px; align-items: center; }
.marca { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 11px 6px 8px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px dashed transparent; font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; transition: opacity 0.1s, transform 0.1s; }
.marca:active { transform: scale(0.97); }
.marca.cancelado { text-decoration: line-through; opacity: 0.4; border-style: solid; }
.marca.pendente { opacity: 0.55; }
.marca i { font-size: 13px; }
.marca .tag { font-family: 'Inter', sans-serif; font-weight: 500; opacity: 0.75; font-size: 11px; }
.t1 .marca { background: var(--accent-agend-bg); color: var(--accent-agend); }
.t2 .marca { background: var(--accent-pre-bg); color: var(--accent-pre); }
.t3 .marca { background: var(--accent-reconf-bg); color: var(--accent-reconf); }
.marca-hint { font-size: 12px; color: var(--ink-soft); font-style: italic; }
.btn-add { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 10px 18px; border-radius: 9px; background: transparent; border: 1.5px solid var(--ink); cursor: pointer; color: var(--ink); width: 100%; justify-content: center; font-weight: 600; font-family: 'Space Grotesk', sans-serif; transition: background 0.12s, color 0.12s; }
@media (min-width: 480px) { .btn-add { width: auto; } }
.btn-add:active { background: var(--ink); color: var(--paper-card); }
.btn-add:disabled { opacity: 0.4; cursor: not-allowed; }
.obs-input { font-size: 13px; width: 100%; margin-top: 10px; padding: 9px 11px; border: 1px solid var(--hairline); border-radius: 9px; background: transparent; color: inherit; outline: none; font-family: 'Inter', sans-serif; }
.obs-input::placeholder { color: var(--ink-soft); }
.obs-input:focus { border-color: var(--ink-soft); }
hr { border: none; border-top: 1.5px dashed var(--hairline); margin: 1.5rem 0; }
.footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.total-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.total-val { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; }
.sync-info { font-size: 11px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-agend); }
.sync-dot.off { background: var(--stamp); }
.sync-dot.pend { background: var(--accent-reconf); }
.painel-dir { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 760px) { .painel-dir { position: static; } }
.box { background: var(--paper-card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 1.1rem; box-shadow: 0 1px 2px rgba(43,40,35,0.04); }
.box-titulo { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-nav button { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 18px; padding: 4px 8px; border-radius: 6px; }
.cal-mes { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 10px; color: var(--ink-soft); text-align: center; padding-bottom: 4px; font-weight: 600; }
.cal-day { font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-align: center; padding: 6px 2px; border-radius: 6px; cursor: pointer; color: var(--ink-soft); }
.cal-day.hoje { background: var(--ink); color: var(--paper); border-radius: 50%; }
.cal-day.tem-dados { color: var(--ink); font-weight: 700; }
.cal-day.selecionado { outline: 1.5px solid var(--accent-pre); border-radius: 6px; }
.cal-day.vazio { cursor: default; pointer-events: none; }
.num-grupo { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--hairline); }
.num-grupo:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.num-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.num-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; }
.num-total { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; }
.num-linha { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
.num-linha .k { color: var(--ink-soft); display: flex; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.d1{background: var(--accent-agend);} .d2{background: var(--accent-pre);} .d3{background: var(--accent-reconf);}
.resumo-vazio { font-size: 12px; color: var(--ink-soft); font-style: italic; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(43,40,35,0.45); align-items: center; justify-content: center; z-index: 100; padding: 1rem; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--paper-card); border-radius: var(--radius); padding: 1.6rem; width: 100%; max-width: 290px; box-shadow: 0 12px 40px rgba(43,40,35,0.18); border: 1px solid var(--hairline); }
.modal-titulo { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-input { font-family: 'IBM Plex Mono', monospace; font-size: 26px; width: 100%; text-align: center; letter-spacing: 10px; margin-bottom: 10px; padding: 12px; border: 1.5px solid var(--hairline); border-radius: 10px; background: var(--paper); color: var(--ink); outline: none; }
.modal-input:focus { border-color: var(--accent-pre); }
.modal-erro { font-size: 12px; color: var(--stamp); margin-bottom: 8px; display: none; }
.modal-acoes { display: flex; gap: 8px; }
.modal-acoes button { flex: 1; font-size: 14px; padding: 11px; border-radius: 9px; cursor: pointer; border: 1.5px solid var(--hairline); font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.btn-ok { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-vol { background: none; color: var(--ink-soft); }
.geral-card { background: var(--paper-card); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 1.1rem 1.25rem; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(43,40,35,0.04); }
.geral-titulo { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.geral-linha { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
.geral-linha .k { color: var(--ink-soft); display: flex; align-items: center; }
.geral-total { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-top: 6px; }
.geral-func-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--hairline); font-size: 13px; }
.geral-func-row:last-child { border-bottom: none; }
.geral-func-row .nome { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
.geral-func-row .breakdown { color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.numgrupo-geral { padding: 10px 0; border-bottom: 1px dashed var(--hairline); }
.numgrupo-geral:last-child { border-bottom: none; padding-bottom: 0; }
.numgrupo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.numgrupo-label { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; }
.numgrupo-total { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; }
.numgrupo-tipos { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
.numgrupo-tipo { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; }
.numgrupo-funcs { font-size: 11px; color: var(--ink-soft); font-family: 'Inter', sans-serif; }
.feed-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--hairline); font-size: 12px; }
.feed-item:last-child { border-bottom: none; }
.feed-item.cancelado { opacity: 0.4; text-decoration: line-through; }
.feed-hora { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-size: 11px; }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.feed-func { font-weight: 600; }
.feed-num { font-family: 'IBM Plex Mono', monospace; margin-left: auto; color: var(--ink-soft); }
.atualiza-btn { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--hairline); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; }
.loading-feed { font-size: 12px; color: var(--ink-soft); font-style: italic; padding: 8px 0; }
</style>
</head>
<body>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-titulo" id="modal-titulo"></div>
    <div class="modal-sub">4 últimos dígitos do WhatsApp</div>
    <input class="modal-input" type="tel" id="modal-input" maxlength="4" placeholder="0000" inputmode="numeric" />
    <div class="modal-erro" id="modal-erro">Preencha os 4 dígitos.</div>
    <div class="modal-acoes">
      <button class="btn-vol" onclick="fecharModal()">Cancelar</button>
      <button class="btn-ok" onclick="confirmar()">Confirmar</button>
    </div>
  </div>
</div>

<div class="layout">
  <div>
    <div class="header">
      <h1>Pedidos COD</h1>
      <span class="sub">tempo real</span>
    </div>

    <div class="tabs" id="tabs"></div>

    <div id="painel-funcionario">
      <div class="dia-label">
        <span id="dia-label"></span>
      </div>

      <div class="bloco t1">
        <div class="bloco-titulo">Agendamento</div>
        <div class="bloco-desc">Pedido fechado, entrega amanhã</div>
        <div class="marcacoes" id="marcas1"></div>
        <button class="btn-add" onclick="abrirModal(1)"><i class="ti ti-plus"></i> Feito</button>
      </div>

      <div class="bloco t2">
        <div class="bloco-titulo">Pré-agendamento</div>
        <div class="bloco-desc">Entrega marcada para 1–2 semanas</div>
        <div class="marcacoes" id="marcas2"></div>
        <button class="btn-add" onclick="abrirModal(2)"><i class="ti ti-plus"></i> Agendado</button>
      </div>

      <div class="bloco t3">
        <div class="bloco-titulo">Reconfirmação</div>
        <div class="bloco-desc">Pré-agendamento anterior confirmado hoje</div>
        <div class="marcacoes" id="marcas3"></div>
        <button class="btn-add" onclick="abrirModal(3)"><i class="ti ti-plus"></i> Confirmado</button>
      </div>

      <hr />

      <div class="footer">
        <div>
          <div class="total-label">Total do dia</div>
          <div class="total-val" id="total-val">0 pedidos</div>
        </div>
        <div style="flex:1"></div>
        <div class="sync-info" id="sync-info"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Sincronizado</span></div>
      </div>
    </div>

    <div id="painel-geral" style="display:none"></div>
  </div>

  <div class="painel-dir">
    <div class="box">
      <div class="cal-nav">
        <button onclick="mudarMes(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="cal-mes" id="cal-mes"></span>
        <button onclick="mudarMes(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="box" id="box-resumo-num">
      <div class="box-titulo">Por número</div>
      <div id="resumo-nums"><span class="resumo-vazio">Nenhum registro ainda</span></div>
    </div>
  </div>
</div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycby9zv_zACS0h0lMctLfOGGHmCY8acdTmsGSkOvTaUMgnJE6ZayUz17hlmNNZZ0Gh5Ix/exec';
const NOMES = {1:'feito', 2:'agendado', 3:'confirmado'};
const TIPO_API = {1:'Agendamento', 2:'Pré-agendamento', 3:'Reconfirmação'};
const TITULOS = {1:'Agendamento', 2:'Pré-agendamento', 3:'Reconfirmação'};
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOWS = ['D','S','T','Q','Q','S','S'];
const FUNCIONARIOS = ['Vini', 'Raphael', 'Guida'];

let state = {1:[], 2:[], 3:[]};
let tipoAtivo = null;
let diaAtivo = toKey(new Date());
let calRef = new Date();
let abaAtiva = FUNCIONARIOS[0];
let filaPendente = [];
let geralTimer = null;

function toKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function keyToLabel(k) { const [y,m,d]=k.split('-'); return new Date(+y,+m-1,+d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); }
function gerarId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtNum(n) { return String(n).padStart(4, '0'); }

try { filaPendente = JSON.parse(localStorage.getItem('ped_fila') || '[]'); } catch(e) { filaPendente = []; }

// ---------- Abas ----------
function renderTabs() {
  const tabs = FUNCIONARIOS.concat(['Geral']);
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    '<button class="tab'+(t===abaAtiva?' ativa':'')+'" onclick="trocarAba(\''+t+'\')">'+t+'</button>'
  ).join('');
}

function trocarAba(nome) {
  abaAtiva = nome;
  renderTabs();
  if (geralTimer) { clearInterval(geralTimer); geralTimer = null; }
  if (nome === 'Geral') {
    document.getElementById('painel-funcionario').style.display = 'none';
    document.getElementById('painel-geral').style.display = 'block';
    document.getElementById('box-resumo-num').style.display = 'none';
    carregarGeral();
    geralTimer = setInterval(carregarGeral, 30000);
  } else {
    document.getElementById('painel-funcionario').style.display = 'block';
    document.getElementById('painel-geral').style.display = 'none';
    document.getElementById('box-resumo-num').style.display = 'block';
    carregarLocal();
    loadDia(diaAtivo);
  }
}

// ---------- Estado local por funcionário ----------
function carregarLocal() {
  try { state = JSON.parse(localStorage.getItem('ped_state_'+abaAtiva+'_'+diaAtivo) || '{"1":[],"2":[],"3":[]}'); }
  catch(e) { state = {1:[],2:[],3:[]}; }
}
function salvarLocal() {
  try { localStorage.setItem('ped_state_'+abaAtiva+'_'+diaAtivo, JSON.stringify(state)); } catch(e){}
}

function loadDia(key) {
  diaAtivo = key;
  carregarLocal();
  const hoje = toKey(new Date());
  const label = keyToLabel(key);
  document.getElementById('dia-label').textContent = label.charAt(0).toUpperCase()+label.slice(1);
  [1,2,3].forEach(n => render(n));
  updateTotal(); renderResumo(); renderCal();
}

// ---------- Envio em tempo real ----------
function enfileirar(evento) {
  filaPendente.push(evento);
  try { localStorage.setItem('ped_fila', JSON.stringify(filaPendente)); } catch(e){}
  processarFila();
}

async function processarFila() {
  if (!filaPendente.length) { atualizarSync(); return; }
  atualizarSync();
  const evento = filaPendente[0];
  const params = new URLSearchParams(evento);
  try {
    const resp = await fetch(SHEETS_URL + '?' + params.toString());
    const json = await resp.json();
    if (json.status === 'ok') {
      filaPendente.shift();
      try { localStorage.setItem('ped_fila', JSON.stringify(filaPendente)); } catch(e){}
      // marca como sincronizado no state
      marcarSincronizado(evento.id);
      if (filaPendente.length) processarFila(); else atualizarSync();
    } else {
      atualizarSync(true);
    }
  } catch(e) {
    atualizarSync(true);
  }
}

function marcarSincronizado(id) {
  [1,2,3].forEach(t => {
    const item = state[t].find(x => x.id === id);
    if (item) item.pendente = false;
  });
  salvarLocal();
  if (abaAtiva !== 'Geral') [1,2,3].forEach(n => render(n));
}

function atualizarSync(falha) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!dot) return;
  if (filaPendente.length) {
    dot.className = 'sync-dot ' + (falha ? 'off' : 'pend');
    txt.textContent = falha ? 'Sem conexão — vai reenviar' : 'Enviando ('+filaPendente.length+')';
  } else {
    dot.className = 'sync-dot';
    txt.textContent = 'Sincronizado';
  }
}

// reenvio periódico da fila (caso tenha falhado)
setInterval(() => { if (filaPendente.length) processarFila(); }, 15000);
window.addEventListener('online', processarFila);

// ---------- Marcações ----------
function render(tipo) {
  const el = document.getElementById('marcas'+tipo);
  if (!el) return;
  const items = state[tipo];
  if (!items.length) { el.innerHTML = '<span class="marca-hint">Nenhum ainda</span>'; return; }
  el.innerHTML = items.map(item =>
    '<button class="marca'+(item.cancelado?' cancelado':'')+(item.pendente?' pendente':'')+'" onclick="toggle('+tipo+',\''+item.id+'\')" title="'+(item.cancelado?'Reativar':'Cancelar')+'">' +
    '<i class="ti '+(item.pendente?'ti-loader':(item.cancelado?'ti-x':'ti-check'))+'"></i>' +
    '<span class="tag">'+NOMES[tipo]+'</span> '+fmtNum(item.num)+'</button>'
  ).join('');
}

function toggle(tipo, id) {
  const item = state[tipo].find(x=>x.id===id);
  if (!item) return;
  item.cancelado = !item.cancelado;
  item.pendente = true;
  salvarLocal();
  render(tipo); updateTotal(); renderResumo();
  enfileirar({
    acao: 'cancelar', id: id, status: item.cancelado ? 'cancelado' : 'ativo'
  });
}

function updateTotal() {
  let t = 0; [1,2,3].forEach(n => t += state[n].filter(x=>!x.cancelado).length);
  const el = document.getElementById('total-val');
  if (el) el.textContent = t+(t===1?' pedido':' pedidos');
}

function renderResumo() {
  const el = document.getElementById('resumo-nums');
  if (!el) return;
  const mapa = {};
  [1,2,3].forEach(t => state[t].filter(x=>!x.cancelado).forEach(x => {
    if (!mapa[x.num]) mapa[x.num]={1:0,2:0,3:0}; mapa[x.num][t]++;
  }));
  const nums = Object.keys(mapa).sort();
  if (!nums.length) { el.innerHTML='<span class="resumo-vazio">Nenhum registro ainda</span>'; return; }
  el.innerHTML = nums.map(num => {
    const d=mapa[num], total=d[1]+d[2]+d[3];
    return '<div class="num-grupo"><div class="num-header"><span class="num-label">···'+fmtNum(num)+'</span><span class="num-total">'+total+' ped.</span></div>'+
      (d[1]?'<div class="num-linha"><span class="k"><span class="dot d1"></span>Agend.</span><span>'+d[1]+'</span></div>':'')+
      (d[2]?'<div class="num-linha"><span class="k"><span class="dot d2"></span>Pré</span><span>'+d[2]+'</span></div>':'')+
      (d[3]?'<div class="num-linha"><span class="k"><span class="dot d3"></span>Reconf.</span><span>'+d[3]+'</span></div>':'')+
      '</div>';
  }).join('');
}

function renderCal() {
  const y=calRef.getFullYear(), m=calRef.getMonth();
  document.getElementById('cal-mes').textContent = MESES[m]+' '+y;
  const grid = document.getElementById('cal-grid');
  let html = DOWS.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const primeiro = new Date(y,m,1).getDay();
  for (let i=0;i<primeiro;i++) html+='<div class="cal-day vazio"></div>';
  const dias = new Date(y,m+1,0).getDate();
  const hoje = toKey(new Date());
  for (let d=1;d<=dias;d++) {
    const key = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let cls='cal-day';
    if (key===hoje) cls+=' hoje';
    let temDados=false;
    try { temDados = !!localStorage.getItem('ped_state_'+abaAtiva+'_'+key); } catch(e){}
    if (temDados) cls+=' tem-dados';
    if (key===diaAtivo && key!==hoje) cls+=' selecionado';
    html+='<div class="'+cls+'" onclick="loadDia(\''+key+'\')">'+d+'</div>';
  }
  grid.innerHTML = html;
}

function mudarMes(dir) { calRef.setMonth(calRef.getMonth()+dir); if (abaAtiva==='Geral') renderGeralCal(); else renderCal(); }

// ---------- Modal ----------
function abrirModal(tipo) {
  tipoAtivo = tipo;
  document.getElementById('modal-titulo').textContent = TITULOS[tipo];
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-erro').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-input').focus(), 50);
}
function fecharModal() { document.getElementById('modal-overlay').classList.remove('open'); tipoAtivo=null; }

let salvandoModal = false;
function confirmar() {
  if (salvandoModal) return;
  const val = document.getElementById('modal-input').value.trim();
  if (!/^\d{4}$/.test(val)) { document.getElementById('modal-erro').style.display='block'; return; }
  salvandoModal = true;
  const id = gerarId();
  state[tipoAtivo].push({id:id, num:val, cancelado:false, pendente:true});
  salvarLocal();
  render(tipoAtivo); updateTotal(); renderResumo();
  enfileirar({
    acao: 'registrar', data: diaAtivo, funcionario: abaAtiva,
    tipo: TIPO_API[tipoAtivo], numero: val, id: id
  });
  fecharModal();
  setTimeout(()=>{ salvandoModal=false; }, 400);
}

document.getElementById('modal-input').addEventListener('keydown', function(e){
  if (e.key==='Enter') confirmar();
  if (e.key==='Escape') fecharModal();
});

// ---------- Aba Geral (tempo real da planilha) ----------
async function carregarGeral() {
  const cont = document.getElementById('painel-geral');
  if (!cont.dataset.loaded) cont.innerHTML = '<div class="geral-card"><span class="loading-feed">Carregando dados...</span></div>';
  try {
    const params = new URLSearchParams({acao:'listar', data: diaAtivo});
    const resp = await fetch(SHEETS_URL + '?' + params.toString());
    const json = await resp.json();
    if (json.status === 'ok') {
      renderGeral(json.eventos || []);
      cont.dataset.loaded = '1';
    }
  } catch(e) {
    if (!cont.dataset.loaded) cont.innerHTML = '<div class="geral-card"><span class="loading-feed">Erro ao carregar. Tentando de novo...</span></div>';
  }
}

function renderGeral(eventos) {
  const ativos = eventos.filter(e => e.status === 'ativo');
  let totGeral = {Agendamento:0,'Pré-agendamento':0,'Reconfirmação':0};
  let porFunc = {};
  FUNCIONARIOS.forEach(f => porFunc[f] = {ag:0,pre:0,re:0,total:0});

  ativos.forEach(e => {
    if (totGeral[e.tipo] !== undefined) totGeral[e.tipo]++;
    if (!porFunc[e.funcionario]) porFunc[e.funcionario] = {ag:0,pre:0,re:0,total:0};
    if (e.tipo==='Agendamento') porFunc[e.funcionario].ag++;
    else if (e.tipo==='Pré-agendamento') porFunc[e.funcionario].pre++;
    else if (e.tipo==='Reconfirmação') porFunc[e.funcionario].re++;
    porFunc[e.funcionario].total++;
  });
  const totalDia = totGeral.Agendamento + totGeral['Pré-agendamento'] + totGeral['Reconfirmação'];
  const agora = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  let html = '';
  html += '<div class="geral-card">';
  html += '<div class="cal-nav"><button onclick="mudarMes(-1)"><i class="ti ti-chevron-left"></i></button><span class="cal-mes">'+MESES[calRef.getMonth()]+' '+calRef.getFullYear()+'</span><button onclick="mudarMes(1)"><i class="ti ti-chevron-right"></i></button></div>';
  html += '<div class="geral-titulo" style="margin-top:14px">'+keyToLabel(diaAtivo)+'<span style="font-size:11px;color:var(--ink-soft);font-weight:400">atualizado '+agora+'</span></div>';
  html += '<div class="geral-linha"><span class="k"><span class="dot d1"></span>Agendamentos</span><span>'+totGeral.Agendamento+'</span></div>';
  html += '<div class="geral-linha"><span class="k"><span class="dot d2"></span>Pré-agendamentos</span><span>'+totGeral['Pré-agendamento']+'</span></div>';
  html += '<div class="geral-linha"><span class="k"><span class="dot d3"></span>Reconfirmações</span><span>'+totGeral['Reconfirmação']+'</span></div>';
  html += '<div class="geral-total">'+totalDia+' pedido'+(totalDia!==1?'s':'')+'</div>';
  html += '</div>';

  html += '<div class="geral-card"><div class="geral-titulo">Por funcionário</div>';
  FUNCIONARIOS.forEach(f => {
    const d = porFunc[f];
    html += '<div class="geral-func-row"><span class="nome">'+f+'</span><span class="breakdown">'+d.total+' ped. · Ag '+d.ag+' · Pré '+d.pre+' · Re '+d.re+'</span></div>';
  });
  html += '</div>';

  // Por número (agrupado)
  const porNum = {};
  ativos.forEach(e => {
    const num = e.numero;
    if (!porNum[num]) porNum[num] = {ag:0, pre:0, re:0, total:0, funcs:{}};
    if (e.tipo==='Agendamento') porNum[num].ag++;
    else if (e.tipo==='Pré-agendamento') porNum[num].pre++;
    else if (e.tipo==='Reconfirmação') porNum[num].re++;
    porNum[num].total++;
    porNum[num].funcs[e.funcionario] = (porNum[num].funcs[e.funcionario] || 0) + 1;
  });
  const numsOrd = Object.keys(porNum).sort((a,b) => porNum[b].total - porNum[a].total);

  html += '<div class="geral-card"><div class="geral-titulo">Por número</div>';
  if (!numsOrd.length) {
    html += '<span class="loading-feed">Nenhum pedido registrado ainda.</span>';
  } else {
    numsOrd.forEach(num => {
      const d = porNum[num];
      html += '<div class="numgrupo-geral">';
      html += '<div class="numgrupo-head"><span class="numgrupo-label">···'+fmtNum(num)+'</span><span class="numgrupo-total">'+d.total+' ped.</span></div>';
      html += '<div class="numgrupo-tipos">';
      if (d.ag) html += '<span class="numgrupo-tipo"><span class="dot d1"></span>Ag '+d.ag+'</span>';
      if (d.pre) html += '<span class="numgrupo-tipo"><span class="dot d2"></span>Pré '+d.pre+'</span>';
      if (d.re) html += '<span class="numgrupo-tipo"><span class="dot d3"></span>Re '+d.re+'</span>';
      html += '</div>';
      const funcsStr = Object.keys(d.funcs).map(f => f+' ('+d.funcs[f]+')').join(' · ');
      html += '<div class="numgrupo-funcs">'+funcsStr+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  // Feed cronológico
  html += '<div class="geral-card"><div class="geral-titulo">Pedidos de hoje <button class="atualiza-btn" onclick="carregarGeral()">Atualizar</button></div>';
  if (!eventos.length) {
    html += '<span class="loading-feed">Nenhum pedido registrado ainda.</span>';
  } else {
    const ordenados = eventos.slice().sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
    ordenados.forEach(e => {
      const dotClass = e.tipo==='Agendamento'?'d1':e.tipo==='Pré-agendamento'?'d2':'d3';
      const hora = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '--:--';
      html += '<div class="feed-item'+(e.status==='cancelado'?' cancelado':'')+'">'+
        '<span class="feed-hora">'+hora+'</span>'+
        '<span class="feed-dot '+dotClass+'"></span>'+
        '<span class="feed-func">'+e.funcionario+'</span>'+
        '<span class="feed-num">···'+fmtNum(e.numero)+'</span></div>';
    });
  }
  html += '</div>';

  // calendário pra navegar
  html += '<div class="box"><div class="box-titulo">Selecionar dia</div><div class="cal-grid" id="cal-grid-geral"></div></div>';

  document.getElementById('painel-geral').innerHTML = html;
  renderGeralCal();
}

function renderGeralCal() {
  const grid = document.getElementById('cal-grid-geral');
  if (!grid) return;
  const y=calRef.getFullYear(), m=calRef.getMonth();
  let html = DOWS.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  const primeiro = new Date(y,m,1).getDay();
  for (let i=0;i<primeiro;i++) html+='<div class="cal-day vazio"></div>';
  const dias = new Date(y,m+1,0).getDate();
  const hoje = toKey(new Date());
  for (let d=1;d<=dias;d++) {
    const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let cls='cal-day';
    if (key===hoje) cls+=' hoje';
    if (key===diaAtivo && key!==hoje) cls+=' selecionado';
    html+='<div class="'+cls+'" onclick="selecionarDiaGeral(\''+key+'\')">'+d+'</div>';
  }
  grid.innerHTML = html;
}

function selecionarDiaGeral(key) {
  diaAtivo = key;
  document.getElementById('painel-geral').dataset.loaded = '';
  carregarGeral();
}

// ---------- Init ----------
renderTabs();
trocarAba(abaAtiva);
processarFila();
</script>
